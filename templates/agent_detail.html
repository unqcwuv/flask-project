<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Agent Dossier</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

<div class="container mt-5">
    <h1 class="text-center">Agent Dossier</h1>

    <div class="card-shadow p-4 bg-secondary">
        <p><strong>ID:</strong> {{ agent.id }}</p>
        <p><strong>Nickame:</strong> {{ agent.nickame }}</p>
        <p><strong>Contact Number:</strong> {{ agent.contact_number }}</p>
        <p><strong>Email:</strong> {{ agent.email }}</p>
        <p><strong>Access Level:</strong> {{ agent.access_level }}</p>
    </div>

    <div class="text-center mt-4">
        <a href="{{ url_for('get_agents') }}" class="btn btn-light">Back to Agent List</a>
    </div>
</div>

</body>
</html>
