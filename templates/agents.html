<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="text-center">Agent List</h1>

        <form method="GET" class="mb-3">
            <select name="access_level" class="form-select">
                <option value="">All Access Levels</option>
                <option value="Secret">Secret</option>
                <option value="Top Secret">Top Secret</option>
            </select>
            <button type="submit" class="btn btn-primary mt-2">Filter</button>
        </form>

        <div class="card-shadow p-3">
            <ul class="list-group">
                {% for agent in agents %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    {{ agent.nickname }}
                    <div>
                        <a href="{{ url_for('edit_agent', id=agent.id) }}" class="btn btn-sm btn-warning">Edit</a>
                        <form action="{{ url_for('delete_agent', id=agent.id) }}" method="POST" style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure?')">Delete</button>
                        </form>
                    </div>
                </li>
                {% endfor %}
            </ul>
        </div>

        <div class="text-center mt-4">
            <a href="{{ url_for('add_agent') }}" class="btn btn-success">Add New Agent</a>
        </div>
    </div>

<form action="{{ url_for('secret_wipe') }}" method="POST">
    <button type="submit" class="btn btn-danger" onclick="return confirm('⚠️ Delete ALL agents?')">SECRET MODE: WIPE DATABASE</button>
</form>
</body>
</html>
