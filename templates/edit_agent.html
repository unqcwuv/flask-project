<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Agent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h1 class="text-center">Edit Agent</h1>
    <div class="card shadow p-4">
        <form method="POST">
            
            <div class="mb-3">
                <label class="form-label">Agent Nickame</label>
                <input type="text" name="nickname" value="{{agent.nickname}}" class="form-control" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Contact Number</label>
                <input type="text" name="contact_number" value="{{agent.contact_number}}" class="form-control" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" value="{{agent.email}}" class="form-control" required>
            </div>
           
            <div class="mb-3">
                <label class="form-label">Access Level</label>
                <input type="text" name="access_level" value="{{agent.access_level}}" class="form-control" required>
            </div>
            
            <button type="submit" class="btn btn-warning w-100">Update Info</button>
            
        </form>
    </div>
    
    <div class="text-center mt-4">
        <a href="{{ url_for('get_agents') }}" class="btn btn-secondary">Back to Agent List</a>
    </div>
</div>

</body>
</html>
